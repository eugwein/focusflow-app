<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FocusFlow — An accessibility app that listens to classroom speech and surfaces important instructions as simple, child-friendly summaries.">
  <title>FocusFlow — Classroom Attention Helper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">FocusFlow</h1>
      <div class="status-area">
        <span class="status-dot" id="status-dot"></span>
        <span id="status">Ready</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Processing Indicator -->
      <div id="processing-indicator">Thinking...</div>

      <!-- Pinned Instructions Section -->
      <section class="pinned-section hidden" id="pinned-section">
        <div class="section-label">📌 Pinned Instructions</div>
        <div id="pinned-cards"></div>
      </section>

      <!-- Recent Alerts Section -->
      <section class="recent-section">
        <div id="recent-cards"></div>
      </section>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">🎧</div>
        <p class="empty-state-text">
          Press Start to begin listening.<br>
          Important things the teacher says will appear here.
        </p>
      </div>

    </main>

    <!-- Transcript Debug Panel -->
    <section class="transcript-section">
      <button class="transcript-toggle" id="transcript-toggle">▶ Show live transcript</button>
      <div class="transcript-panel" id="transcript-panel">
        <pre class="transcript-content" id="transcript-content"></pre>
      </div>
    </section>

    <!-- Controls -->
    <footer class="controls">
      <button class="btn btn-start" id="btn-start">● Start</button>
      <button class="btn btn-stop hidden" id="btn-stop">■ Stop</button>
      <button class="btn btn-clear" id="btn-clear">Clear</button>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
